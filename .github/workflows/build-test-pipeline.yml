name: Build and Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out the Code
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run the Build Script
        run: ./scripts/build.sh

      - name: Run the Test Script
        run: ./scripts/test.sh